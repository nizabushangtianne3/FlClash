name: release stable

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          submodules: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Release
        run: bash tool/release.sh stable --push --yes

      - name: Build release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\)+.*/\1/p' pubspec.yaml)"
          test -n "$version"
          gh workflow run build.yaml --ref "v$version"
          run_id=""
          for _ in $(seq 1 30); do
            run_id="$(gh run list \
              --workflow build.yaml \
              --limit 20 \
              --json databaseId,event,headBranch \
              --jq ".[] | select(.event == \"workflow_dispatch\" and .headBranch == \"v$version\") | .databaseId" |
              head -n 1)"
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 2
          done
          test -n "$run_id"
          gh run watch "$run_id" --exit-status
